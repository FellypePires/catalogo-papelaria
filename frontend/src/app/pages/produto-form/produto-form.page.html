<section class="formulario-pagina">
  <a class="voltar" routerLink="/catalogo">← Voltar ao catálogo</a>
  <p class="sobretitulo">ÁREA DO ADMINISTRADOR</p>
  <h1>{{ id ? 'Editar produto' : 'Cadastrar produto' }}</h1>
  <p class="subtitulo">Preencha as informações do item de papelaria.</p>
  @if (erro()) { <div class="mensagem erro">{{ erro() }}</div> }

  <form #formulario="ngForm" (ngSubmit)="salvar()">
    <label for="nome">Nome *</label>
    <input id="nome" name="nome" [(ngModel)]="nome" required maxlength="120" placeholder="Ex.: Caneta esferográfica" />

    <label for="descricao">Descrição</label>
    <textarea id="descricao" name="descricao" [(ngModel)]="descricao" maxlength="500" rows="3" placeholder="Conte um pouco sobre o produto"></textarea>

    <div class="duas-colunas">
      <div><label for="cor">Cor *</label><input id="cor" name="cor" [(ngModel)]="cor" required maxlength="40" placeholder="Ex.: azul" /></div>
      <div><label for="preco">Preço (R$) *</label><input id="preco" name="preco" [(ngModel)]="preco" required type="number" min="0.01" step="0.01" /></div>
    </div>

    <label for="categoria">Categoria *</label>
    <select id="categoria" name="categoriaId" [(ngModel)]="categoriaId" required>
      <option [ngValue]="null" disabled>Escolha uma categoria</option>
      @for (categoria of categorias(); track categoria.id) { <option [ngValue]="categoria.id">{{ categoria.nome }}</option> }
    </select>
    @if (categorias().length === 0) { <p class="ajuda">Cadastre uma categoria antes de criar um produto.</p> }

    <div class="botoes"><a class="botao secundario" routerLink="/catalogo">Cancelar</a><button class="botao primario" [disabled]="salvando() || categorias().length === 0">{{ salvando() ? 'Salvando...' : 'Salvar produto' }}</button></div>
  </form>
</section>
