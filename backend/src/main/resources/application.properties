spring.application.name=papelaria-api

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catalogo_papelaria}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET:chave-local-de-desenvolvimento-com-mais-de-32-caracteres}
app.admin.email=${ADMIN_EMAIL:admin@papelaria.com}
app.admin.password=${ADMIN_PASSWORD:123456}
